<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/threejs-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NanoVer WebXR</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="control-panel">
      <div id="tab-bar">
        <button class="tab-btn active" data-tab="simulation">Recording</button>
        <button class="tab-btn" data-tab="server">Server</button>
        <button class="tab-btn" data-tab="info">Info</button>
      </div>

      <div class="tab-content active" id="tab-simulation">
        <button id="btn-play-pause" class="panel-btn primary">Play / Pause</button>
        <input id="seek-slider" type="range" min="0" max="1" value="0" step="1" />
        <div id="sim-info">
          <span id="trajectory-name">No trajectory loaded</span>
        </div>
      </div>

      <div class="tab-content" id="tab-server">
        <button id="btn-refresh" class="panel-btn">Refresh</button>
        <div id="server-buttons-container"></div>
      </div>

      <div class="tab-content" id="tab-info">
        <h2 id="info-title">NanoVer WebXR client</h2>
        <a id="info-link" href="https://www.intangiblerealitieslab.org/" target="_blank" rel="noopener noreferrer">theirl.org</a>
      </div>
      
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
